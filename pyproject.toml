[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-lib"
version = "0.1.0"
description = "Librería de cálculo de préstamos con amortización francesa (cuota fija)."
requires-python = ">=3.10,<4.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools]
py-modules = ["loan"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
